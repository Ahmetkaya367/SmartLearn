server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 500MB
  webflux:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter
        - id: course-service
          uri: http://course-service:8080
          predicates:
            - Path=/api/courses/**
          filters:
            - AuthenticationFilter
        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthenticationFilter
        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter
        - id: enrollment-service
          uri: http://enrollment-service:8084
          predicates:
            - Path=/api/enrollments/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT Secret injected from Config Server or env
app:
  jwt:
    secret: ${APP_JWT_SECRET}